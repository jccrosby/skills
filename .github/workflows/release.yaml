name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm release token
        run: |
          if [ -n "${{ secrets.REPO_AUTH_TOKEN }}" ]; then
            echo "Using REPO_AUTH_TOKEN secret for PR creation."
          else
            echo "REPO_AUTH_TOKEN is not set; falling back to GITHUB_TOKEN. If your org blocks Actions PR creation, add a PAT to this repo secret."
          fi

      - name: Create Version Pull Request
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm dlx changeset git-tag
          commit: 'chore: version skills'
          title: 'chore: version skills'
          github-token: ${{ secrets.REPO_AUTH_TOKEN || github.token }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_AUTH_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.REPO_AUTH_TOKEN || github.token }}
